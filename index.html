const URLBASE='https://flhsqerpikhihtirfutu.supabase.co',KEY='sb_publishable_vzvJV73AoLe_isJ3PhXplw_zke7NG_F',TENANT='central_office';let session=null,page='Events',opened=null,query='';
const seed={suppliers:[{id:'s1',name:'Sukanda Djaya',category:'Dairy & pantry',phone:'',delivery_days:'Monday–Saturday',payment_terms:'30 days'},{id:'s2',name:'UD Sayur Bening',category:'Vegetables & herbs',delivery_days:'Daily'},{id:'s3',name:'Global Seafood & Meat',category:'Meat & seafood',delivery_days:'On request'}],ingredients:[{id:'i1',name:'Whipping cream 35%',unit:'l',category:'Dairy'},{id:'i2',name:'White asparagus',unit:'kg',category:'Vegetables'},{id:'i3',name:'Wagyu short rib, bone-in',unit:'kg',category:'Meat'},{id:'i4',name:'Unsalted butter',unit:'kg',category:'Dairy'}],supplier_prices:[{id:'p1',ingredient_id:'i1',supplier_id:'s1',current_price:115000,previous_price:110000,is_preferred:true},{id:'p2',ingredient_id:'i2',supplier_id:'s2',current_price:285000,previous_price:285000,is_preferred:true},{id:'p3',ingredient_id:'i3',supplier_id:'s3',current_price:425000,previous_price:410000,is_preferred:true},{id:'p4',ingredient_id:'i4',supplier_id:'s1',current_price:185000,previous_price:190000,is_preferred:true}],events:[{id:'e1',name:'CHANEL · Jakarta',event_date:'2026-11-26',pax:100,status:'draft',notes:'Sample event — quantities are illustrative.'},{id:'e2',name:'Villa Manis · Private dinner',event_date:'2026-11-15',pax:16,status:'draft'}],event_order_lines:[{id:'l1',event_id:'e1',ingredient_id:'i1',supplier_price_id:'p1',quantity:5,unit:'l',unit_price:115000},{id:'l2',event_id:'e1',ingredient_id:'i3',supplier_price_id:'p3',quantity:25,unit:'kg',unit_price:425000},{id:'l3',event_id:'e2',ingredient_id:'i1',supplier_price_id:'p1',quantity:2,unit:'l',unit_price:115000}],recipes:[{id:'r1',name:'White asparagus velouté',yield_portions:10,target_fc_pct:30,category:'Sauces'}],recipe_ingredients:[{id:'ri1',recipe_id:'r1',ingredient_id:'i1',supplier_price_id:'p1',quantity:300,unit:'ml',yield_pct:100},{id:'ri2',recipe_id:'r1',ingredient_id:'i2',supplier_price_id:'p2',quantity:600,unit:'g',yield_pct:70}],dishes:[{id:'d1',name:'Semur-braised wagyu',selling_price:450000,target_fc_pct:30,course:'Main'}],dish_components:[{id:'dc1',dish_id:'d1',component_name:'Braised short rib',cost_override:95000},{id:'dc2',dish_id:'d1',component_name:'Garnish & sauce',cost_override:18000}]};let db=JSON.parse(localStorage.getItem('kitchenops-sample')||'null')||structuredClone(seed);
function toast(m){$('#toast').textContent=m;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4500)}
async function authRequest(grant,body){const r=await fetch(URLBASE+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||'Sign-in failed');return {...d,expires_at:Date.now()+d.expires_in*1000}}
async function api(table,method='GET',body,filter=''){if(!session)throw Error('Sign in first');if(Date.now()>session.expires_at-60000)session=await authRequest('refresh_token',{refresh_token:session.refresh_token});const r=await fetch(URLBASE+'/rest/v1/'+table+filter,{method,headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',Prefer:'return=representation'},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error((await r.json()).message||'Request failed');return r.status===204?[]:r.json()}
async function reload(){let next={};for(const t of Object.keys(seed)){let rows=[],offset=0;while(true){const batch=await api(t,'GET',null,'?select=*&limit=1000&offset='+offset+(['suppliers','ingredients','events','recipes','dishes'].includes(t)?'&tenant_id=eq.'+TENANT:''));rows.push(...batch);if(batch.length<1000)break;offset+=1000}next[t]=rows}db=next;render()}
async function save(t,data,id,after){try{if(session){await api(t,id?'PATCH':'POST',data,id?'?id=eq.'+encodeURIComponent(id):'');await reload()}else{if(id)Object.assign(db[t].find(x=>x.id===id),data);else db[t].push({id:(crypto.randomUUID?crypto.randomUUID():'sample-'+Date.now()+'-'+Math.random().toString(16).slice(2)),...data});localStorage.setItem('kitchenops-sample',JSON.stringify(db));render()}$('#modal').close();if(after)after();toast('Saved'+(session?' to live workspace':' in sample workspace'))}catch(e){toast(e.message)}}
function rows(t){return db[t]||[]}function find(t,id){return rows(t).find(x=>x.id===id)||{}}function price(id){return find('supplier_prices',id)}function lines(id){return rows('event_order_lines').filter(x=>x.event_id===id)}function eventTotal(id){return lines(id).reduce((s,x)=>s+x.quantity*x.unit_price,0)}function btn(text,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${text}</button>`}function table(headers,body){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${headers.length}" class="empty">No records yet.</td></tr>`}</tbody></table></div>`}
function modal(title,fields,submit){$('#modalbody').innerHTML=`<h2>${title}</h2><form id="form">${fields}<div class="actions"><button type="button" onclick="document.querySelector('dialog').close()">Cancel</button><button class="primary">Save</button></div></form>`;$('#form').onsubmit=e=>{e.preventDefault();submit(Object.fromEntries(new FormData(e.target)))};$('#modal').showModal()}
function field(name,label,value='',type='text'){return `<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0.0001" step="any"':''} required>`}function select(name,label,options){return `<label>${label}</label><select name="${name}">${options}</select>`}
const navs=['Events','Purchase list','Ingredients','Suppliers','Pricelists','Recipe costing','Dish costing','Monthly'];function go(p){page=p;opened=null;query='';render()}
function render(){ $('#nav').innerHTML=navs.map((n,i)=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span style="opacity:.55;margin-right:12px">${['▦','≡','◈','◇','↗','◴','◒','▥'][i]}</span>${n}</button>`).join('');$('#mode').textContent=session?'LIVE WORKSPACE':'SAMPLE WORKSPACE';$('#auth').textContent=session?'Disconnect':'Connect live data ↗';let titles={Events:['Service starts here.','Plan your events. Keep every ingredient in order.'],'Purchase list':['One list. Every event.','Active event orders, combined by supplier.'],Ingredients:['Know your ingredients.','Compare supplier prices and keep an eye on changes.'],Suppliers:['Your supply network.','The people and partners behind every service.'],Pricelists:['Keep prices current.','Review and update supplier pricing.'],'Recipe costing':['Every gram accounted for.','Yield-aware costing, from prep to portion.'],'Dish costing':['Build a better margin.','Component costs, food cost and selling prices.'],Monthly:['The month at a glance.','Planned purchasing commitments by event date.']};let title=titles[page];let html=`${session?'': '<div class="notice">Sample workspace · Illustrative data, saved in this browser. Connect to access your existing KitchenOps records.</div>'}<div class="hero"><div><div class="eyebrow">KITCHEN OPERATIONS / ${page}</div><h1>${title[0]}</h1><p>${title[1]}</p></div>${page==='Events'?btn('+ New event','editEvent()', 'primary'):page==='Suppliers'?btn('+ Add supplier','editSupplier()', 'primary'):''}</div>`;if(page==='Events')html+=eventView();if(page==='Purchase list')html+=purchase();if(page==='Ingredients'||page==='Pricelists')html+=ingredientView();if(page==='Suppliers')html+=supplierView();if(page==='Recipe costing')html+=costView(false);if(page==='Dish costing')html+=costView(true);if(page==='Monthly')html+=monthly();$('#content').innerHTML=html;}
function eventView(){if(opened){const e=find('events',opened);return `<div class="toolbar">${btn('← All events',"opened=null;render()")}${btn('Edit event',`editEvent('${e.id}')`)}${btn('+ Add ingredient','addLine()', 'primary')}${btn('Print','window.print()')}<select aria-label="Event status" onchange="save('events',{status:this.value},'${e.id}')">${['draft','ordered','complete'].map(s=>`<option ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="panel"><h2>${esc(e.name)} · ${e.pax} guests</h2><p>${esc(e.event_date)} · ${esc(e.notes||'')}</p>${table(['Ingredient','Quantity','Unit price','Total',''],lines(e.id).map(l=>`<tr><td>${esc(find('ingredients',l.ingredient_id).name)}<small>${esc(find('suppliers',price(l.supplier_price_id).supplier_id).name)}</small></td><td>${l.quantity} ${esc(l.unit)}</td><td>${money(l.unit_price)}</td><td>${money(l.quantity*l.unit_price)}</td><td>${btn('Remove',`removeLine('${l.id}')`)}</td></tr>`).join(''))}<div class="total">${money(eventTotal(e.id))}</div></div>`}return `<div class="stats">${[['Active events',rows('events').filter(e=>e.status!=='complete').length,'Upcoming & in progress'],['Planned purchases',money(rows('events').filter(e=>e.status!=='complete').reduce((s,e)=>s+eventTotal(e.id),0)),'Based on order snapshots'],['Suppliers',rows('suppliers').length,'Your sourcing network'],['Ingredients',rows('ingredients').length,'In your ingredient library']].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div><div class="grid">${rows('events').slice().sort((a,b)=>a.event_date.localeCompare(b.event_date)).map(e=>`<div class="card"><div class="eyebrow">${esc(e.event_date)}</div><h3>${esc(e.name)}</h3><span class="badge">${esc(e.status)}</span><div class="row"><span>${e.pax} guests · ${lines(e.id).length} items</span><b>${money(eventTotal(e.id))}</b></div>${btn('Open event →',`opened='${e.id}';render()`)}</div>`).join('')||'<div class="empty">Create your first event to start ordering.</div>'}</div>`}
function editEvent(id){const e=find('events',id);modal(id?'Edit event':'New event',field('name','Event name',e.name||'')+field('event_date','Date',e.event_date||'','date')+field('pax','Guests',e.pax||10,'number')+field('notes','Notes',e.notes||'—'),async d=>{if(id)return save('events',{...d,pax:+d.pax},id);try{const payload={...d,pax:+d.pax,status:'draft',tenant_id:TENANT};let created;if(session){const result=await api('events','POST',payload);created=result[0];await reload()}else{created={id:(crypto.randomUUID?crypto.randomUUID():'sample-'+Date.now()+'-'+Math.random().toString(16).slice(2)),...payload};db.events.push(created);localStorage.setItem('kitchenops-sample',JSON.stringify(db))}if(!created?.id)throw Error('Event could not be created');page='Events';opened=created.id;render();$('#modal').close();orderEntry(created.id)}catch(e){toast(e.message)}})}
let orderTarget=null, chosenPrice=null;
function orderEntry(eventId){orderTarget=eventId||rows('events').find(e=>e.status==='draft')?.id||rows('events').find(e=>e.status!=='complete')?.id;chosenPrice=null;const active=rows('events').filter(e=>e.status!=='complete');if(!active.length){editEvent();return}$('#modalbody').innerHTML=`<h2>Add to order</h2><p>Search an ingredient, choose a supplier and enter your quantity.</p><form id="quickorder"><label for="order-event">Event</label><select id="order-event" required onchange="orderTarget=this.value">${active.map(e=>`<option value="${e.id}" ${e.id===orderTarget?'selected':''}>${esc(e.name)}</option>`).join('')}</select><label for="order-search">Find ingredient</label><input id="order-search" autocomplete="off" placeholder="Type cream, wagyu, butter…" oninput="searchOrder(this.value)"><div id="order-results" role="region" aria-label="Ingredient suggestions" style="max-height:260px;overflow:auto;margin-top:10px"></div><div id="order-picked"></div><div class="actions"><button type="button" onclick="document.querySelector('dialog').close()">Done</button><button id="order-add" class="primary" disabled>Add & next ingredient</button></div></form>`;$('#quickorder').onsubmit=e=>{e.preventDefault();submitOrder()};$('#modal').showModal();$('#order-search').focus();searchOrder('')}
function searchOrder(q){chosenPrice=null;$('#order-picked').innerHTML='';$('#order-add').disabled=true;const terms=q.toLowerCase().trim().split(/\s+/);const matches=rows('supplier_prices').filter(p=>{const i=find('ingredients',p.ingredient_id),su=find('suppliers',p.supplier_id);return i.id&&su.id&&i.is_active!==false&&su.is_active!==false&&Number.isFinite(+p.current_price)&&terms.every(t=>(i.name+' '+su.name).toLowerCase().includes(t))}).sort((a,b)=>String(find('ingredients',a.ingredient_id).name).localeCompare(String(find('ingredients',b.ingredient_id).name))||a.current_price-b.current_price);$('#order-results').innerHTML=matches.slice(0,40).map(p=>`<button type="button" style="display:block;width:100%;text-align:left;margin-bottom:6px" onclick="pickOrderPrice('${p.id}')"><b>${esc(find('ingredients',p.ingredient_id).name)}</b><span style="float:right">${money(p.current_price)} / ${esc(find('ingredients',p.ingredient_id).unit)}</span><small style="display:block;color:#737373;margin-top:4px">${esc(find('suppliers',p.supplier_id).name)}${p.is_preferred?' · Preferred supplier':''}</small></button>`).join('')||'<p>No matching supplier prices. Add an ingredient and supplier price in Ingredients first.</p>';if(matches.length>40)$('#order-results').innerHTML+='<p>Keep typing to narrow the results.</p>'}
function pickOrderPrice(id){chosenPrice=id;const p=price(id),i=find('ingredients',p.ingredient_id);$('#order-results').innerHTML='';$('#order-picked').innerHTML=`<div class="notice"><b>${esc(i.name)}</b><br>${esc(find('suppliers',p.supplier_id).name)} · ${money(p.current_price)} / ${esc(i.unit)}</div><label for="order-qty">Quantity (${esc(i.unit)})</label><input id="order-qty" type="number" min="0.0001" step="any" value="1" required oninput="document.querySelector('#order-subtotal').textContent=money(this.value*price(chosenPrice).current_price)"><p>Line total: <b id="order-subtotal">${money(p.current_price)}</b></p>`;$('#order-add').disabled=false;$('#order-qty').focus();$('#order-qty').select()}
async function submitOrder(){const p=price(chosenPrice),qty=+$('#order-qty')?.value;if(!p.id||!Number.isFinite(qty)||qty<=0||!find('events',orderTarget).id)return toast('Choose an event, supplier and a valid quantity');const target=orderTarget;$('#order-add').disabled=true;await save('event_order_lines',{event_id:target,ingredient_id:p.ingredient_id,supplier_price_id:p.id,unit:find('ingredients',p.ingredient_id).unit,quantity:qty,unit_price:+p.current_price},undefined,()=>orderEntry(target));if($('#order-add'))$('#order-add').disabled=!chosenPrice}
function addLine(){orderEntry(opened)}
async function removeLine(id){try{if(session){await api('event_order_lines','DELETE',null,'?id=eq.'+id);await reload()}else{db.event_order_lines=rows('event_order_lines').filter(l=>l.id!==id);localStorage.setItem('kitchenops-sample',JSON.stringify(db));render()}}catch(e){toast(e.message)}}
function combined(){let m=new Map();for(const l of rows('event_order_lines')){if(find('events',l.event_id).status==='complete')continue;let k=[price(l.supplier_price_id).supplier_id,l.ingredient_id,l.unit,l.unit_price].join('|');if(!m.has(k))m.set(k,{...l,quantity:0,supplier:find('suppliers',price(l.supplier_price_id).supplier_id).name||'Unassigned',events:new Set()});m.get(k).quantity+=+l.quantity;m.get(k).events.add(find('events',l.event_id).name)}return [...m.values()].sort((a,b)=>a.supplier.localeCompare(b.supplier))}
function purchase(){const data=combined();return `<div class="toolbar">${btn('+ Add ingredients','orderEntry()', 'primary')}${btn('+ New event','editEvent()')}${btn('↓ Export CSV','exportOrders()', 'primary')}${btn('Print purchase list','window.print()')}<span style="color:var(--muted)">Draft + ordered events · completed excluded</span></div><div class="panel">${table(['Supplier / ingredient','Events','Quantity','Unit price','Total'],data.map(l=>`<tr><td><strong>${esc(find('ingredients',l.ingredient_id).name)}</strong><small>${esc(l.supplier)}</small></td><td>${esc([...l.events].join(', '))}</td><td>${l.quantity} ${esc(l.unit)}</td><td>${money(l.unit_price)}</td><td>${money(l.quantity*l.unit_price)}</td></tr>`).join(''))}<div class="total">${money(data.reduce((s,l)=>s+l.quantity*l.unit_price,0))}</div></div>`}
function exportOrders(){let csv=[['Supplier','Ingredient','Events','Quantity','Unit','Unit price IDR','Total IDR'],...combined().map(l=>[l.supplier,find('ingredients',l.ingredient_id).name,[...l.events].join('; '),l.quantity,l.unit,l.unit_price,l.quantity*l.unit_price])].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='KitchenOps-purchases.csv';a.click();URL.revokeObjectURL(a.href)}
function ingredientView(){return `<div class="toolbar"><input type="search" placeholder="Search ingredients or suppliers…" value="${esc(query)}" oninput="query=this.value;document.querySelector('#pricebody').innerHTML=priceRows()" aria-label="Search ingredients">${btn('+ Ingredient','editIngredient()')}${btn('+ Supplier price','newPrice()')}</div><div class="panel">${page==='Pricelists'?'<p>Select Update to record a new price. Previous prices remain visible for comparison.</p>':''}${table(['Ingredient','Supplier','Price / unit','Previous','Change',''],priceRows()).replace('<tbody>','<tbody id="pricebody">')}</div>`}
function priceRows(){return rows('supplier_prices').filter(p=>(find('ingredients',p.ingredient_id).name+' '+find('suppliers',p.supplier_id).name).toLowerCase().includes(query.toLowerCase())).map(p=>{let i=find('ingredients',p.ingredient_id),change=p.previous_price?(p.current_price-p.previous_price)/p.previous_price*100:0;return `<tr><td><b>${esc(i.name)}</b><small>${esc(i.category)} ${p.is_preferred?'· Preferred':''}</small></td><td>${esc(find('suppliers',p.supplier_id).name)}</td><td>${money(p.current_price)} / ${esc(i.unit)}</td><td>${money(p.previous_price)}</td><td style="color:${change>0?'#a44a3f':'#555555'}">${change>0?'+':''}${change.toFixed(1)}%</td><td>${btn('Update',`updatePrice('${p.id}')`)}</td></tr>`}).join('')}
function updatePrice(id){const p=price(id);modal('Update supplier price',field('current_price','New price in IDR',p.current_price,'number'),d=>save('supplier_prices',{current_price:+d.current_price,previous_price:p.current_price,last_updated:new Date().toISOString()},id))}function editIngredient(){modal('Add ingredient',field('name','Ingredient')+field('category','Category')+select('unit','Purchasing unit',['kg','l','pc','pack'].map(x=>`<option>${x}</option>`).join('')),d=>save('ingredients',{...d,is_active:true,tenant_id:TENANT}))}function newPrice(){modal('Add supplier price',select('ingredient_id','Ingredient',rows('ingredients').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''))+select('supplier_id','Supplier',rows('suppliers').map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join(''))+field('current_price','Price per purchasing unit, IDR',1,'number'),d=>save('supplier_prices',{...d,current_price:+d.current_price,is_preferred:false}))}
function supplierView(){return `<div class="grid">${rows('suppliers').map(s=>`<div class="card"><span class="badge">${esc(s.category||'Supplier')}</span><h3>${esc(s.name)}</h3><p>${esc(s.delivery_days||'Delivery to confirm')}<br>${esc(s.payment_terms||'Terms to confirm')}<br>${esc(s.phone||s.email||'No contact added')}</p><div class="row"><span>${rows('supplier_prices').filter(p=>p.supplier_id===s.id).length} products</span></div>${btn('Edit supplier',`editSupplier('${s.id}')`)}</div>`).join('')}</div>`}function editSupplier(id){const s=find('suppliers',id);modal(id?'Edit supplier':'New supplier',['name','category','phone','email','delivery_days','payment_terms'].map(k=>field(k,k.replaceAll('_',' '),s[k]||'—')).join(''),d=>save('suppliers',{...d,...(!id?{tenant_id:TENANT,is_active:true}:{})},id))}
function costItem(r){let p=price(r.supplier_price_id),i=find('ingredients',r.ingredient_id),factor=r.unit===i.unit?1:((r.unit==='g'&&i.unit==='kg')||(r.unit==='ml'&&i.unit==='l'))?.001:null;if(factor===null||!p.id||!(+r.yield_pct>0))return null;return r.quantity*factor*p.current_price/(r.yield_pct/100)}
function costView(dish){const list=rows(dish?'dishes':'recipes'),item=find(dish?'dishes':'recipes',opened||list[0]?.id);if(!item.id)return '<div class="empty">No costing records available.</div>';opened=item.id;let rr=rows(dish?'dish_components':'recipe_ingredients').filter(r=>r[dish?'dish_id':'recipe_id']===item.id),costs=rr.map(r=>dish?+r.cost_override:costItem(r)),valid=costs.every(c=>c!==null),total=costs.reduce((s,c)=>s+(c||0),0),per=total/(dish?1:(item.yield_portions||1)),target=+item.target_fc_pct||30;return `<div class="toolbar"><select aria-label="Select costing" onchange="opened=this.value;render()">${list.map(x=>`<option value="${x.id}" ${x.id===item.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>${btn('Print costing card','window.print()')}</div><div class="panel"><h2>${esc(item.name)}</h2><p>${dish?'Per dish':`${item.yield_portions} portions`} · Target food cost ${target}%</p>${table(dish?['Component','Cost']:['Ingredient','Quantity','Yield','Cost'],rr.map((r,k)=>`<tr><td>${esc(dish?r.component_name:find('ingredients',r.ingredient_id).name)}</td>${dish?'':`<td>${r.quantity} ${esc(r.unit)}</td><td>${r.yield_pct}%</td>`}<td>${costs[k]===null?'Check unit / price / yield':money(costs[k])}</td></tr>`).join(''))}<div class="stats" style="margin-top:25px">${[['Total cost',valid?money(total):'Incomplete'],['Per portion',valid?money(per):'Incomplete'],['Suggested sell',valid?money(per/(target/100)):'Incomplete'],[dish?'Actual food cost':'Food cost target',dish?(item.selling_price? (per/item.selling_price*100).toFixed(1)+'%':'No sell price'):target+'%']].map(x=>`<div class="stat">${x[0]}<b>${x[1]}</b></div>`).join('')}</div>${dish?`<p>Selling price ${money(item.selling_price)} · Gross profit ${valid?money(item.selling_price-per):'Incomplete'}</p>`:''}</div>`}
function monthly(){return `<div class="toolbar"><input type="month" aria-label="Month" value="${query||'2026-11'}" onchange="query=this.value;render()"></div><div class="notice">Planned purchases only. This is not actual invoiced spend or a budget comparison.</div><div class="panel">${table(['Event','Date','Status','Planned purchasing'],rows('events').filter(e=>e.event_date.startsWith(query||'2026-11')).map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.event_date)}</td><td>${esc(e.status)}</td><td>${money(eventTotal(e.id))}</td></tr>`).join(''))}</div>`}
$('#auth').onclick=()=>{if(session){session=null;db=JSON.parse(localStorage.getItem('kitchenops-sample')||'null')||structuredClone(seed);opened=null;render();return}modal('Connect existing KitchenOps','<p>Sign in with your existing KitchenOps email and password. Changes in live mode update the existing central office database.</p>'+field('email','Email','','email')+field('password','Password','','password'),async d=>{try{session=await authRequest('password',d);await reload();$('#modal').close();toast('Live workspace connected')}catch(e){session=null;toast(e.message)}})};render();
</script></html>
