if(authMode==='forgot')return box('Reset your password',`<p>Enter your email. We'll send you a link to set a new password.</p><form id="authform"><label for="a-email">Email</label><input id="a-email" name="email" type="email" autocomplete="email" value="${esc(lastEmail)}" required><div class="actions" style="margin-top:20px;display:flex;gap:10px"><button type="button" onclick="authMode='signin';authMsg='';render()">Back to sign in</button><button class="primary">Send reset link</button></div></form>`);
if(authMode==='newpass')return box('Set a new password',`<form id="authform"><label for="a-pass">New password</label><input id="a-pass" name="password" type="password" autocomplete="new-password" minlength="8" required><label for="a-pass2">Repeat new password</label><input id="a-pass2" name="password2" type="password" autocomplete="new-password" minlength="8" required><div style="margin-top:20px"><button class="primary">Save password and sign in</button></div></form>`);
return box('Sign in to KitchenOps',`<form id="authform"><label for="a-email">Email</label><input id="a-email" name="email" type="email" autocomplete="email" value="${esc(lastEmail)}" required><label for="a-pass">Password</label><input id="a-pass" name="password" type="password" autocomplete="current-password" required><div style="margin-top:20px;display:flex;gap:10px;align-items:center;justify-content:space-between"><button type="button" onclick="authMode='forgot';authMsg='';render()" style="border:0;background:none;padding:0;color:var(--muted);text-decoration:underline">Forgot password?</button><button class="primary">Sign in</button></div></form>`)}
function bindAuth(){const f=$('#authform');if(!f)return;f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));if(d.email)lastEmail=d.email;const b=f.querySelector('.primary');b.disabled=true;try{
 if(authMode==='forgot'){const r=await fetch(URLBASE+'/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+location.pathname),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:d.email})});if(!r.ok){const x=await r.json().catch(()=>({}));throw Error(x.msg||x.error_description||'Could not send the email. Try again in a minute.')}authMode='signin';authMsg='Check your email for the reset link, then come back here.';render();return}
 if(authMode==='newpass'){if(d.password!==d.password2)throw Error('The two passwords do not match.');const r=await fetch(URLBASE+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({password:d.password})});if(!r.ok){const x=await r.json().catch(()=>({}));throw Error(x.msg||'Could not save the password.')}authMode='signin';authMsg='';keep();toast('Password saved');await reload();return}
 session=await authRequest('password',d);keep();authMsg='';await reload();toast('Signed in')}catch(err){if(authMode==='signin')session=null;authMsg=err.message==='Invalid login credentials'?'Email or password is not correct. Use “Forgot password?” to set a new one.':err.message;render()}finally{b.disabled=false}}}
function signOut(msg){session=null;keep();db=EMPTY();opened=null;authMode='signin';authMsg=msg||'';render()}
$('#auth').onclick=()=>signOut();$('#refresh').onclick=async()=>{const b=$('#refresh');b.disabled=true;b.textContent='↻ Refreshing…';try{await reload();toast('Up to date')}catch(e){toast(e.message)}finally{b.disabled=false;b.textContent='↻ Refresh'}};
async function boot(){const h=new URLSearchParams(location.hash.slice(1));
 if(h.get('error_description')){authMsg=h.get('error_description').replace(/\+/g,' ');history.replaceState(null,'',location.pathname)}
 else if(h.get('access_token')){session={access_token:h.get('access_token'),refresh_token:h.get('refresh_token'),expires_at:Date.now()+(+h.get('expires_in')||3600)*1000};history.replaceState(null,'',location.pathname);
  try{const r=await fetch(URLBASE+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}});session.user=await r.json()}catch(e){}
  if(h.get('type')==='recovery'){authMode='newpass';$('#content').innerHTML=authView();bindAuth();$('#auth').hidden=true;return}keep();return reload()}
 let saved=null;try{saved=JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){}
 if(saved?.refresh_token){session=saved;loading=true;render();try{if(Date.now()>session.expires_at-60000){session=await authRequest('refresh_token',{refresh_token:session.refresh_token});keep()}await reload()}catch(e){loading=false;signOut('Please sign in again.')}return}
 render()}
boot();
</script></html>
